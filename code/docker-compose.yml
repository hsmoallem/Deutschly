version: "3.8"

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: deutschly_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deutschly_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production_987}
      POSTGRES_DB: ${POSTGRES_DB:-deutschly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deutschly_user} -d ${POSTGRES_DB:-deutschly}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Deutschly Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deutschly_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-deutschly_user}:${POSTGRES_PASSWORD:-change_me_in_production_987}@postgres:5432/${POSTGRES_DB:-deutschly}?schema=public
      JWT_SECRET: ${JWT_SECRET:-production_secure_jwt_secret_change_me}
      NODE_ENV: production
      PORT: 3000
    volumes:
      - audio_cache_data:/app/public/audio_cache
    ports:
      - "127.0.0.1:3000:3000"

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: deutschly_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt

volumes:
  postgres_data:
  audio_cache_data:
  certbot_etc:
  certbot_var:
